name: CI Test (xcode)

# setup-ci (bannzai/castle) が作った workflow に、Firebase の設定ファイルを secret から書き出す手順を足したため、手動管理に切り替えた。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # シェルのテストを回す。human-verification-check.yml の判定は本番と同じ ubuntu の runner (GNU の grep・awk) で確かめる。
  # resolve-ios-device.sh の本番は macOS の bash 3.2 だが、jq と bash 3.2 にもある機能だけを使うため ubuntu で回す
  shell-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 「## 人間が確認」の判定のテスト
        run: bash scripts/test/test-human-verification-check.sh
      - name: 実機を解決するスクリプトのテスト
        run: bash scripts/test/test-resolve-ios-device.sh

  test:
    runs-on: macos-26
    # スクリーンショットのテストが 9 言語の画像を描いて文字を読むようになり、run 45964679019 で 20 分を超えて止められたため。
    # 9 言語で通った run 45980593368 は 17 分 23 秒、45997154138 は 19 分 9 秒で、20 分に近い。長い方の 19 分 9 秒に、runner の混み具合の揺れを見込んで 1.8 倍ほどの 35 分にした。
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 設定ファイルを書き出すスクリプトのテスト
        run: bash scripts/test/test-restore-google-service-info-plist.sh
      - name: Firebase の設定ファイルを secret から書き出す
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: scripts/restore-google-service-info-plist.sh
      - name: 単体テストを実行する
        run: |
          xcodebuild test -project "QuickBuy.xcodeproj" -scheme "QuickBuy" \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO
