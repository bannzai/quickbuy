# CodeQL のコード スキャン (advanced setup)。
# default setup の自動ビルドは、target 指定の xcodebuild が firebase/nanopb の直下の `BUILD` ファイルと `build/` の衝突で落ち、
# secret も読めないため GoogleService-Info.plist が無いことでも落ちる (https://github.com/bannzai/quickbuy/pull/51 の「CodeQL の Analyze (swift) の失敗」)。
# そのため swift は手動ビルドにし、CI と同じく secret から設定ファイルを書き出してから scheme のビルドを行う (2026-11-19 に owner が advanced setup への切り替えを決めた)。
# 言語・頻度は切り替える前の default setup (actions と swift、push・pull_request と週 1 回) に合わせた。
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      security-events: write # 解析の結果を code scanning に送るため
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: swift
            build-mode: manual
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Firebase の設定ファイルを secret から書き出す
        if: matrix.build-mode == 'manual'
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: scripts/restore-google-service-info-plist.sh
      - name: アプリをビルドする (CI の release-build と同じ scheme のビルド)
        if: matrix.build-mode == 'manual'
        run: |
          xcodebuild build -project QuickBuy.xcodeproj -scheme QuickBuy -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
