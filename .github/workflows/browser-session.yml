# リポジトリの HTML を Linux Runner 上の Chromium で開く caller workflow。実体は bannzai/webtunnel の session.yml（reusable workflow）。
# 参照: https://github.com/bannzai/webtunnel の PROJECT.md「各アプリ repo での実行（reusable workflow）」
name: browser-session
# run-name は local/webtunnel CLI が run を特定するキーのためこの形式を維持する
run-name: "session=${{ inputs.session }} duration=${{ inputs.duration_minutes }}m"

on:
  workflow_dispatch: # fork PR に Secrets を渡さないため workflow_dispatch のみ
    # session / duration_minutes は local/webtunnel の up が常に送るため宣言必須
    # （未定義の input を送ると dispatch が拒否される）
    inputs:
      session:
        description: "セッション名。tailnet ホスト名 webtunnel-<session>-<run id> になる（小文字英数字とハイフンのみ）"
        required: true
        default: quickbuy
      duration_minutes:
        description: "セッション維持時間（分）"
        required: true
        default: "60"
      start_url:
        description: "Chromium 起動時に開く URL。空ならリポジトリのルートの一覧を開く"
        required: false
        default: ""
      record:
        description: "セッション画面を録画して artifact に残す（public リポジトリのため録画は公開される）"
        required: false
        default: "true"
      preview:
        description: "セッション画面をリアルタイムに見る preview を tailnet に公開する"
        required: false
        default: "true"

jobs:
  session:
    # reusable workflow の job が持てる権限はここで付与した分が上限になる。id-token: write を使うのは
    # session.yml の auth key 発行 job だけで、start_command を実行する job には渡らない
    permissions:
      id-token: write # Tailscale の OIDC (workload identity federation) 認証に必要
      contents: read
    # タグ運用はしないため main の commit SHA で固定する（更新時は SHA を書き換える）
    uses: bannzai/webtunnel/.github/workflows/session.yml@6a6146d2b43e45d56931abdfda6c8382073483ca # main 2026-11-09
    with:
      session: ${{ inputs.session }}
      duration_minutes: ${{ inputs.duration_minutes }}
      start_url: ${{ inputs.start_url }}
      record: ${{ inputs.record }}
      preview: ${{ inputs.preview }}
      # docs/ と documents/design/ の両方を開けるよう、リポジトリのルートを静的ファイルとして配信する。
      # 127.0.0.1 に束縛しないと session.yml の loopback の検証で失敗する
      start_command: python3 -m http.server "$PORT" --bind 127.0.0.1
      port: "8080"
    secrets:
      TS_OIDC_CLIENT_ID: ${{ secrets.TS_OIDC_CLIENT_ID }}
      TS_OIDC_AUDIENCE: ${{ secrets.TS_OIDC_AUDIENCE }}
