<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>トップページ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; color: #111318; font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif; display: flex; flex-direction: column">
  <div style="background: {{accent}}; color: #FFFFFF; padding: 56px 16px 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="font-size: 26px; font-weight: 900; letter-spacing: 0.5px">Quick Buy</div>
      <button aria-label="設定" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>
      </button>
    </div>
    <label for="home-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden">商品を検索</label>
    <div style="height: 46px; background: #FFFFFF; border-radius: 12px; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #5B6270">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <input id="home-search" type="search" placeholder="商品名・店の名前で探す" style="flex-grow: 1; border: 0; outline: 0; font-size: 16px; font-family: inherit; color: #111318; background: transparent; min-width: 0">
    </div>
  </div>
  <div style="flex-grow: 1; padding: 16px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <div style="background: #FFE9C7; border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 12px">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 18px; font-weight: 900; line-height: 1.3">いつもの商品を 1 タップで</div>
        <div style="font-size: 13px; color: #4A3A12; line-height: 1.5">お気に入りに入れると、ホーム画面のウィジェットから買い直せます</div>
      </div>
      <svg aria-hidden="true" width="64" height="64" viewBox="0 0 64 64" fill="none"><rect x="8" y="14" width="48" height="36" rx="10" fill="#FFFFFF"></rect><rect x="14" y="20" width="16" height="24" rx="5" fill="#F1E4D6"></rect><rect x="34" y="20" width="16" height="24" rx="5" fill="#DCEBF7"></rect></svg>
    </div>
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h2 style="margin: 0; font-size: 20px; font-weight: 900">人気の商品</h2>
      <div style="font-size: 13px; font-weight: 700; color: {{accent}}">もっと見る</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="background: #FFFFFF; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column">
        <div style="height: 120px; background: #F1E4D6; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="72" height="88" viewBox="0 0 72 88" fill="none"><path d="M14 20h44l-4 60H18L14 20z" fill="#6B4226"></path><rect x="12" y="10" width="48" height="12" rx="4" fill="#8A5A36"></rect><rect x="24" y="40" width="24" height="22" rx="4" fill="#F1E4D6"></rect></svg>
        </div>
        <div style="padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px">
          <div style="font-size: 11px; font-weight: 700; color: #5B6270">mori-coffee.example</div>
          <div style="font-size: 15px; font-weight: 700; line-height: 1.35">[商品名] コーヒー豆 中煎り</div>
          <div style="font-size: 16px; font-weight: 900">[価格]</div>
          <button style="height: 44px; border: 2px solid {{accent}}; border-radius: 10px; background: #FFFFFF; color: {{accent}}; font-size: 14px; font-weight: 700; font-family: inherit; margin-top: 4px">お気に入り追加</button>
        </div>
      </div>
      <div style="background: #FFFFFF; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column">
        <div style="height: 120px; background: #DCEBF7; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="64" height="88" viewBox="0 0 64 88" fill="none"><rect x="12" y="26" width="40" height="56" rx="8" fill="#2F6FB0"></rect><rect x="24" y="8" width="16" height="20" rx="3" fill="#1F4E80"></rect><rect x="20" y="44" width="24" height="20" rx="4" fill="#DCEBF7"></rect></svg>
        </div>
        <div style="padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px">
          <div style="font-size: 11px; font-weight: 700; color: #5B6270">Amazon</div>
          <div style="font-size: 15px; font-weight: 700; line-height: 1.35">[商品名] 洗濯用せっけん</div>
          <div style="font-size: 16px; font-weight: 900">[価格]</div>
          <button style="height: 44px; border: 2px solid {{accent}}; border-radius: 10px; background: #FFFFFF; color: {{accent}}; font-size: 14px; font-weight: 700; font-family: inherit; margin-top: 4px">お気に入り追加</button>
        </div>
      </div>
    </div>
  </div>
  <div style="height: 84px; box-sizing: border-box; background: #FFFFFF; border-top: 1px solid #DADDE3; display: flex; padding: 8px 0 24px">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; color: {{accent}}; font-size: 11px; font-weight: 700">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9H3z"></path></svg>ホーム
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; color: #5B6270; font-size: 11px; font-weight: 700">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"></path></svg>お気に入り
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B6E4F","options":["#0B6E4F","#1D4ED8","#C2410C"]},"$preview":{"width":390,"height":844}}'>
/** トップページ。通常の EC のように、検索窓と商品の画像つきの一覧を見せ、商品からお気に入りに追加できる状態の見本を描く。 */
class Component extends DCLogic {
  /** テンプレートへ渡す値。色の調整 (accent) だけを返す。 */
  renderVals() {
    return {
      // 既定の #0B6E4F は、白の文字を載せてコントラスト比 4.5:1 以上になる緑。商品の画像の色と並べても見出しとボタンが埋もれない濃さにした
      accent: this.props.accent ?? '#0B6E4F'
    };
  }
}
</script>
</body>
</html>
