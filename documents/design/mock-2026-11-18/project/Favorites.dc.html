<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>お気に入り一覧とカートイン</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; color: #111318; font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif; display: flex; flex-direction: column; position: relative">
  <div style="background: {{accent}}; color: #FFFFFF; padding: 56px 16px 16px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 900">お気に入り</h1>
  </div>
  <div style="flex-grow: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="background: #FFFFFF; border-radius: 14px; padding: 12px; display: flex; gap: 12px; align-items: center">
      <div style="width: 68px; height: 68px; border-radius: 10px; background: #F1E4D6; flex-shrink: 0; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="38" height="48" viewBox="0 0 72 88" fill="none"><path d="M14 20h44l-4 60H18L14 20z" fill="#6B4226"></path><rect x="12" y="10" width="48" height="12" rx="4" fill="#8A5A36"></rect></svg>
      </div>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
        <div style="font-size: 15px; font-weight: 700; line-height: 1.3">[商品名] コーヒー豆 中煎り</div>
        <div style="font-size: 13px; font-weight: 700; color: {{accent}}">200g / 豆のまま</div>
        <div style="font-size: 12px; color: #5B6270">mori-coffee.example ・ 2 個</div>
      </div>
      <button style="height: 44px; border: 0; border-radius: 10px; background: {{accent}}; color: #FFFFFF; font-size: 14px; font-weight: 900; font-family: inherit; padding: 0 12px; flex-shrink: 0">カートイン</button>
    </div>
    <div style="background: #FFFFFF; border-radius: 14px; padding: 12px; display: flex; gap: 12px; align-items: center">
      <div style="width: 68px; height: 68px; border-radius: 10px; background: #F1E4D6; flex-shrink: 0; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="38" height="48" viewBox="0 0 72 88" fill="none"><path d="M14 20h44l-4 60H18L14 20z" fill="#6B4226"></path><rect x="12" y="10" width="48" height="12" rx="4" fill="#8A5A36"></rect></svg>
      </div>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
        <div style="font-size: 15px; font-weight: 700; line-height: 1.3">[商品名] コーヒー豆 中煎り</div>
        <div style="font-size: 13px; font-weight: 700; color: {{accent}}">500g / 中挽き</div>
        <div style="font-size: 12px; color: #5B6270">mori-coffee.example ・ 1 個</div>
      </div>
      <button style="height: 44px; border: 0; border-radius: 10px; background: {{accent}}; color: #FFFFFF; font-size: 14px; font-weight: 900; font-family: inherit; padding: 0 12px; flex-shrink: 0">カートイン</button>
    </div>
    <div style="background: #FFFFFF; border-radius: 14px; padding: 12px; display: flex; gap: 12px; align-items: center">
      <div style="width: 68px; height: 68px; border-radius: 10px; background: #DCEBF7; flex-shrink: 0; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="34" height="48" viewBox="0 0 64 88" fill="none"><rect x="12" y="26" width="40" height="56" rx="8" fill="#2F6FB0"></rect><rect x="24" y="8" width="16" height="20" rx="3" fill="#1F4E80"></rect></svg>
      </div>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
        <div style="font-size: 15px; font-weight: 700; line-height: 1.3">[商品名] 洗濯用せっけん</div>
        <div style="font-size: 13px; font-weight: 700; color: {{accent}}">詰め替え 1L</div>
        <div style="font-size: 12px; color: #9A3412; font-weight: 700">Amazon ・ 1 個 ・ そろそろ買う頃</div>
      </div>
      <button style="height: 44px; border: 0; border-radius: 10px; background: {{accent}}; color: #FFFFFF; font-size: 14px; font-weight: 900; font-family: inherit; padding: 0 12px; flex-shrink: 0">カートイン</button>
    </div>
  </div>
  <div role="status" style="position: absolute; left: 12px; right: 12px; bottom: 100px; background: #111318; color: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 12px">
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 15px; font-weight: 900">購入画面を開きますか？</div>
      <div style="font-size: 12px; color: #D5D9E0; line-height: 1.4">コーヒー豆 200g を 2 個、カートに入れた状態で開きます</div>
    </div>
    <button style="height: 44px; border: 0; border-radius: 10px; background: #FFFFFF; color: #111318; font-size: 15px; font-weight: 900; font-family: inherit; padding: 0 16px; flex-shrink: 0">開く</button>
  </div>
  <div style="height: 84px; box-sizing: border-box; background: #FFFFFF; border-top: 1px solid #DADDE3; display: flex; padding: 8px 0 24px">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; color: #5B6270; font-size: 11px; font-weight: 700">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9H3z"></path></svg>ホーム
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; color: {{accent}}; font-size: 11px; font-weight: 700">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"></path></svg>お気に入り
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B6E4F","options":["#0B6E4F","#1D4ED8","#C2410C"]},"$preview":{"width":390,"height":844}}'>
/** お気に入りの一覧。種類 (バリアント) ごとに行を分け、「カートイン」を押した直後に「購入画面を開きますか？」のトーストが出ている状態の見本を描く。 */
class Component extends DCLogic {
  /** テンプレートへ渡す値。色の調整 (accent) だけを返す。 */
  renderVals() {
    return {
      // 既定の #0B6E4F は、白の文字を載せてコントラスト比 4.5:1 以上になる緑。商品の画像の色と並べても見出しとボタンが埋もれない濃さにした
      accent: this.props.accent ?? '#0B6E4F'
    };
  }
}
</script>
</body>
</html>
