<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>通知の許可の説明</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #111318; font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif; display: flex; flex-direction: column; padding: 72px 20px 32px; gap: 20px">
  <div style="height: 180px; background: #E3F1EC; border-radius: 20px; display: flex; align-items: center; justify-content: center; gap: 14px">
    <div style="width: 96px; height: 96px; background: #FFFFFF; border-radius: 22px; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; box-sizing: border-box">
      <div style="width: 34px; height: 34px; border-radius: 8px; background: #F1E4D6"></div>
      <div style="height: 22px; border-radius: 6px; background: {{accent}}"></div>
    </div>
    <svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    <div style="width: 150px; background: #FFFFFF; border-radius: 16px; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; gap: 6px; align-items: center"><div style="width: 20px; height: 20px; border-radius: 5px; background: {{accent}}"></div><div style="font-size: 11px; font-weight: 900">Quick Buy</div></div>
      <div style="font-size: 12px; font-weight: 700; line-height: 1.35">購入画面を開きますか？</div>
    </div>
  </div>
  <h1 style="margin: 0; font-size: 26px; font-weight: 900; line-height: 1.3">通知をオンにするとウィジェットから買い直せます</h1>
  <div style="display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; gap: 12px; align-items: flex-start">
      <div style="width: 36px; height: 36px; border-radius: 10px; background: #E3F1EC; color: {{accent}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 17px; font-weight: 900">1</div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 16px; font-weight: 700; line-height: 1.4">ウィジェットで「カートイン」を押した時</div>
        <div style="font-size: 14px; color: #3A404B; line-height: 1.55">「購入画面を開きますか？」の通知を出します。通知をタップすると店の購入画面が開きます</div>
      </div>
    </div>
    <div style="display: flex; gap: 12px; align-items: flex-start">
      <div style="width: 36px; height: 36px; border-radius: 10px; background: #E3F1EC; color: {{accent}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 17px; font-weight: 900">2</div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 16px; font-weight: 700; line-height: 1.4">そろそろ買う頃になった時</div>
        <div style="font-size: 14px; color: #3A404B; line-height: 1.55">お気に入りごとに決めた日数が過ぎたら知らせます</div>
      </div>
    </div>
  </div>
  <div style="font-size: 13px; color: #5B6270; line-height: 1.6">通知だけでは購入されません。支払いの確定は毎回店の画面で行います。宣伝の通知は送りません</div>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
    <button style="height: 54px; border: 0; border-radius: 14px; background: {{accent}}; color: #FFFFFF; font-size: 17px; font-weight: 900; font-family: inherit">通知をオンにする</button>
    <button style="height: 44px; border: 0; background: transparent; color: #3A404B; font-size: 15px; font-weight: 700; font-family: inherit">あとで</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B6E4F","options":["#0B6E4F","#1D4ED8","#C2410C"]},"$preview":{"width":390,"height":844}}'>
/** 通知の許可を求める前の説明の画面。最初のお気に入りを追加した直後に出し、なぜ通知が要るのかを伝えてから OS の許可の表示へ進む状態の見本を描く。 */
class Component extends DCLogic {
  /** テンプレートへ渡す値。色の調整 (accent) だけを返す。 */
  renderVals() {
    return {
      // 既定の #0B6E4F は、白の文字を載せてコントラスト比 4.5:1 以上になる緑。商品の画像の色と並べても見出しとボタンが埋もれない濃さにした
      accent: this.props.accent ?? '#0B6E4F'
    };
  }
}
</script>
</body>
</html>
