<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ホーム画面のウィジェット</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
body{margin:0}
a{color:#111318}a:hover{color:#111318}
</style>
</helmet>
<div style="width: 390px; height: 420px; box-sizing: border-box; background: #C9CED6; color: #111318; font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif; display: flex; flex-direction: column; justify-content: center; padding: 16px; gap: 16px">
  <div style="height: 170px; box-sizing: border-box; background: #FFFFFF; border-radius: 24px; padding: 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <a href="#" style="text-decoration: none; background: #F2F2F4; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between">
      <div style="width: 44px; height: 44px; border-radius: 10px; background: #E4EEF0; display: flex; align-items: center; justify-content: center; color: {{accent}}">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 13px; font-weight: 700; line-height: 1.3">コーヒー豆</div>
        <div style="font-size: 12px; color: #5B6270">2 個</div>
      </div>
    </a>
    <a href="#" style="text-decoration: none; background: #FDEEE3; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between">
      <div style="width: 44px; height: 44px; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #9A3412">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 13px; font-weight: 700; line-height: 1.3">せっけん</div>
        <div style="font-size: 12px; font-weight: 700; color: #9A3412">そろそろ</div>
      </div>
    </a>
    <a href="#" style="text-decoration: none; background: #F2F2F4; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between">
      <div style="width: 44px; height: 44px; border-radius: 10px; background: #E4EEF0; display: flex; align-items: center; justify-content: center; color: {{accent}}">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 13px; font-weight: 700; line-height: 1.3">プロテイン</div>
        <div style="font-size: 12px; color: #5B6270">1 個</div>
      </div>
    </a>
  </div>
  <div style="display: flex; gap: 18px">
    <a href="#" style="text-decoration: none; width: 170px; height: 170px; box-sizing: border-box; background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between">
      <div style="width: 52px; height: 52px; border-radius: 12px; background: #E4EEF0; display: flex; align-items: center; justify-content: center; color: {{accent}}">
        <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 15px; font-weight: 700; line-height: 1.3">コーヒー豆</div>
        <div style="font-size: 13px; font-weight: 700; color: {{accent}}">タップで購入画面</div>
      </div>
    </a>
    <a href="#" style="text-decoration: none; width: 170px; height: 170px; box-sizing: border-box; background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between">
      <div style="width: 52px; height: 52px; border-radius: 12px; background: #FDEEE3; display: flex; align-items: center; justify-content: center; color: #9A3412">
        <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 15px; font-weight: 700; line-height: 1.3">せっけん</div>
        <div style="font-size: 13px; font-weight: 700; color: #9A3412">そろそろ買う頃</div>
      </div>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0F5E6B","options":["#0F5E6B","#1D4ED8","#9A3412"]},"$preview":{"width":390,"height":420}}'>
/** ホーム画面のウィジェット。上が 3 件を並べる中サイズ、下が 1 件を出す小サイズ (通常と、リマインドの日数が過ぎた状態) の見本を描く。 */
class Component extends DCLogic {
  /** テンプレートへ渡す値。色の調整 (accent) だけを返す。 */
  renderVals() {
    return {
      // 既定の #0F5E6B は、白の文字を載せてコントラスト比 4.5:1 以上になる落ち着いた青緑。店ごとの色と競合しないよう彩度を抑えた
      accent: this.props.accent ?? '#0F5E6B'
    };
  }
}
</script>
</body>
</html>
