<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>お気に入りの編集とリマインド</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F2F4; color: #111318; font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif; display: flex; flex-direction: column; padding: 60px 16px 24px; gap: 16px">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <button style="height: 44px; border: 0; background: transparent; padding: 0 4px; color: {{accent}}; font-size: 16px; font-weight: 500; font-family: inherit">戻る</button>
    <button style="height: 44px; border: 0; background: transparent; padding: 0 4px; color: {{accent}}; font-size: 16px; font-weight: 700; font-family: inherit">保存</button>
  </div>
  <div style="display: flex; align-items: center; gap: 12px">
    <div style="width: 64px; height: 64px; border-radius: 12px; background: #E4EEF0; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: {{accent}}">
      <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
      <h1 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.3">[商品名] 洗濯用せっけん</h1>
      <div style="font-size: 13px; color: #5B6270">sukoyaka-soap.example</div>
    </div>
  </div>
  <div style="background: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="edit-name" style="font-size: 13px; font-weight: 500; color: #5B6270">名前</label>
      <input id="edit-name" type="text" value="[商品名] 洗濯用せっけん" style="height: 44px; box-sizing: border-box; border: 1px solid #C4C9D2; border-radius: 10px; padding: 0 12px; font-size: 16px; font-family: inherit; color: #111318; background: #FFFFFF; width: 100%">
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="font-size: 16px; font-weight: 500">個数</div>
      <div style="display: flex; align-items: center; gap: 12px">
        <button aria-label="個数を減らす" style="width: 44px; height: 44px; border: 1px solid #C4C9D2; border-radius: 10px; background: #FFFFFF; padding: 0; display: flex; align-items: center; justify-content: center; color: #111318">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"></path></svg>
        </button>
        <div style="min-width: 28px; text-align: center; font-size: 20px; font-weight: 700">1</div>
        <button aria-label="個数を増やす" style="width: 44px; height: 44px; border: 1px solid #C4C9D2; border-radius: 10px; background: #FFFFFF; padding: 0; display: flex; align-items: center; justify-content: center; color: #111318">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        </button>
      </div>
    </div>
  </div>
  <div style="background: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h2 style="margin: 0; font-size: 17px; font-weight: 700">リマインド</h2>
      <button role="switch" aria-checked="true" aria-label="リマインドを使う" style="width: 52px; height: 44px; border: 0; background: transparent; padding: 6px 0; display: flex; align-items: center">
        <span style="width: 52px; height: 32px; border-radius: 16px; background: {{accent}}; display: flex; align-items: center; justify-content: flex-end; padding: 2px; box-sizing: border-box"><span style="width: 28px; height: 28px; border-radius: 14px; background: #FFFFFF"></span></span>
      </button>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="font-size: 16px; font-weight: 500">知らせる間隔</div>
      <div style="display: flex; align-items: center; gap: 12px">
        <button aria-label="日数を減らす" style="width: 44px; height: 44px; border: 1px solid #C4C9D2; border-radius: 10px; background: #FFFFFF; padding: 0; display: flex; align-items: center; justify-content: center; color: #111318">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"></path></svg>
        </button>
        <div style="min-width: 72px; text-align: center; font-size: 20px; font-weight: 700">30 日ごと</div>
        <button aria-label="日数を増やす" style="width: 44px; height: 44px; border: 1px solid #C4C9D2; border-radius: 10px; background: #FFFFFF; padding: 0; display: flex; align-items: center; justify-content: center; color: #111318">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        </button>
      </div>
    </div>
    <div style="font-size: 13px; color: #5B6270; line-height: 1.5">購入画面を開いた日から数え直します<br>次の知らせは [日付] です</div>
  </div>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
    <button style="height: 52px; border: 0; border-radius: 14px; background: {{accent}}; color: #FFFFFF; font-size: 17px; font-weight: 700; font-family: inherit">購入画面を開く</button>
    <button style="height: 44px; border: 0; background: transparent; color: #B42318; font-size: 16px; font-weight: 500; font-family: inherit">お気に入りから外す</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0F5E6B","options":["#0F5E6B","#1D4ED8","#9A3412"]},"$preview":{"width":390,"height":844}}'>
/** お気に入りの編集の画面。名前と個数の変更と、リマインド (何日ごとに知らせるか) を設定している状態の見本を描く。 */
class Component extends DCLogic {
  /** テンプレートへ渡す値。色の調整 (accent) だけを返す。 */
  renderVals() {
    return {
      // 既定の #0F5E6B は、白の文字を載せてコントラスト比 4.5:1 以上になる落ち着いた青緑。店ごとの色と競合しないよう彩度を抑えた
      accent: this.props.accent ?? '#0F5E6B'
    };
  }
}
</script>
</body>
</html>
