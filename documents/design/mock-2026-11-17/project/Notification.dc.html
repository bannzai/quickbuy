<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>リマインドの通知</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
body{margin:0}
a{color:#111318}a:hover{color:#111318}
</style>
</helmet>
<div style="width: 390px; height: 200px; box-sizing: border-box; background: #C9CED6; color: #111318; font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif; display: flex; flex-direction: column; justify-content: center; padding: 16px">
  <a href="#" style="text-decoration: none; background: #FFFFFF; border-radius: 22px; padding: 14px; display: flex; align-items: center; gap: 12px">
    <div style="width: 44px; height: 44px; border-radius: 10px; background: {{accent}}; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>
    </div>
    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
      <div style="display: flex; justify-content: space-between; gap: 8px">
        <div style="font-size: 15px; font-weight: 700; line-height: 1.35">そろそろ買う頃です</div>
        <div style="font-size: 13px; color: #5B6270; flex-shrink: 0">今</div>
      </div>
      <div style="font-size: 15px; line-height: 1.4">[商品名] 洗濯用せっけん</div>
      <div style="font-size: 13px; color: #5B6270; line-height: 1.4">タップすると購入画面が開きます</div>
    </div>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0F5E6B","options":["#0F5E6B","#1D4ED8","#9A3412"]},"$preview":{"width":390,"height":200}}'>
/** リマインドの通知。設定した日数が過ぎた時に端末に出る通知の見本を描く。 */
class Component extends DCLogic {
  /** テンプレートへ渡す値。色の調整 (accent) だけを返す。 */
  renderVals() {
    return {
      // 既定の #0F5E6B は、白の文字を載せてコントラスト比 4.5:1 以上になる落ち着いた青緑。店ごとの色と競合しないよう彩度を抑えた
      accent: this.props.accent ?? '#0F5E6B'
    };
  }
}
</script>
</body>
</html>
